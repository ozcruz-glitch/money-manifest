<script src="vendor/supabase.js"></script>
<style>
  :root{
    --paper: #FDF8F5;
    --paper-raised: #FFFFFF;
    --ink: #3A2A2C;
    --ink-soft: #8C7570;
    --rule: #F0DDD6;
    --rule-strong: #E0BCAF;
    --brand: #D97A52;
    --brand-dark: #7A4025;
    --brand-tint: #F7BAA2;
    --warn: #C1503A;
    --warn-tint: #F7E3DC;
    --good: #2E7D4F;

    --cat-bills: #0072B2;
    --cat-car: #D55E00;
    --cat-expenses: #009E73;
    --cat-insurances: #CC79A7;
    --cat-loans: #5A5A5A;
    --cat-mortgage: #56B4E9;
    --cat-subscriptions: #E69F00;
    --cat-yearly: #B8A100;
    --cat-extra1: #96426B;
    --cat-extra2: #A8450F;
    --cat-extra3: #7F7F7F;

    --savings: #045C8C;
    --shadow: 0 1px 0 rgba(58,42,44,0.08);
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  /* No double-tap zoom (easy to trigger by accident on buttons and number fields);
     pinch zoom is controlled by the viewport tag set in the script below. Also stops iOS
     enlarging text on its own when the phone is turned sideways. */
  html{ touch-action:manipulation; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight:600; margin:0; color:var(--ink); }
  input, select, button{ font-family:inherit; font-size:14px; color:var(--ink); }
  button{ cursor:pointer; }
  ::selection{ background:var(--brand-tint); }

  .app{ display:flex; min-height:100vh; }

  /* ---------- Sidebar ---------- */
  .rail{
    width:216px; flex:none;
    background:var(--brand-dark);
    color:#EFEDE3;
    display:flex; flex-direction:column;
    padding:22px 0 16px;
    position:sticky; top:0; height:100vh;
  }
  .rail-brand{ padding:0 22px 20px; border-bottom:1px solid rgba(239,237,227,0.14); margin-bottom:6px; }
  .rail-brand .mark{ font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:22px; font-weight:700; letter-spacing:0.2px; }
  .rail-brand .sub{ font-size:11.5px; color:#B9C4BC; margin-top:3px; }
  .rail-nav{ display:flex; flex-direction:column; margin-top:10px; flex:1; }
  .tab{
    position:relative;
    text-align:left; background:none; border:none; color:#CFD8D1;
    padding:12px 22px 12px 24px;
    font-size:14px; font-weight:500;
    display:flex; align-items:center; gap:10px;
    border-left:3px solid transparent;
  }
  .tab .num{ font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:12px; color:#8DA095; width:14px; }
  .tab:hover{ background:rgba(239,237,227,0.06); color:#fff; }
  .tab.active{ background:var(--paper); color:var(--brand-dark); border-left:3px solid var(--cat-subscriptions); }
  .tab.active .num{ color:var(--cat-subscriptions); }
  .rail-signout{ display:none; flex:none; align-items:center; justify-content:center; width:42px; height:42px;
    background:none; border:1px solid rgba(239,237,227,0.25); border-radius:8px; color:#EFEDE3; cursor:pointer; }
  .rail-signout:active{ background:rgba(239,237,227,0.12); }
  .rail-brand{ cursor:pointer; }
  .rail-foot{ padding:14px 22px 0; border-top:1px solid rgba(239,237,227,0.14); }
  .rail-foot button{
    width:100%; background:none; border:1px solid rgba(239,237,227,0.3); color:#CFD8D1;
    padding:8px 10px; border-radius:3px; font-size:12px;
  }
  .rail-foot button:hover{ background:rgba(239,237,227,0.08); color:#fff; }
  .save-note{ font-size:10.5px; color:#8DA095; margin-top:8px; text-align:center; }

  /* ---------- Main ---------- */
  .main{ flex:1; min-width:0; }
  .stat-strip{
    display:grid; grid-template-columns: repeat(4,1fr);
    border-bottom:1px solid var(--rule-strong);
    background:var(--paper-raised);
  }
  .stat{ padding:16px 22px; border-left:1px solid var(--rule); }
  .stat:first-child{ border-left:none; }
  .stat .label{ font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); }
  .stat .value{ font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:24px; font-weight:600; margin-top:4px; font-variant-numeric: tabular-nums; }
  .stat.warn .value{ color:var(--warn); }
  .stat.good .value{ color:var(--good); }

  .view{ padding:28px 34px 60px; max-width:1080px; }
  .view h2{ font-size:22px; margin-bottom:4px; }
  .view .lede{ color:var(--ink-soft); font-size:13px; margin-bottom:22px; max-width:60ch; }

  section.block{ margin-bottom:34px; }
  .block-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; }
  .block-head h3{ font-size:15px; }
  .block-head .hint{ font-size:12px; color:var(--ink-soft); }

  /* buttons */
  .btn{
    background:var(--brand); color:#fff; border:none; padding:8px 14px;
    border-radius:3px; font-size:12.5px; font-weight:600; letter-spacing:0.01em;
  }
  .btn:hover{ background:var(--brand-dark); }
  .btn.ghost{ background:none; color:var(--brand); border:1px solid var(--brand); }
  .btn.ghost:hover{ background:var(--brand-tint); }
  .btn.small{ padding:5px 10px; font-size:11.5px; }
  .icon-btn{
    background:none; border:none; color:var(--ink-soft); font-size:15px; padding:2px 6px; border-radius:3px;
  }
  .icon-btn:hover{ background:var(--warn-tint); color:var(--warn); }

  /* ---------- Overview ---------- */
  .overview-grid{ display:grid; grid-template-columns: 300px 1fr; gap:32px; align-items:start; }
  .legend{ list-style:none; margin:0; padding:0; }
  .legend li{ display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--rule); font-size:13px; }
  .legend li:last-child{ border-bottom:none; }
  .swatch{ width:10px; height:10px; border-radius:2px; flex:none; }
  .legend .name{ flex:1; }
  .legend .amt{ font-variant-numeric: tabular-nums; color:var(--ink-soft); }
  .legend .pct{ font-variant-numeric: tabular-nums; width:38px; text-align:right; color:var(--ink-soft); font-size:11.5px; }

  .top-items{ width:100%; border-collapse:collapse; }
  .top-items td{ padding:7px 6px; border-bottom:1px solid var(--rule); font-size:13px; }
  .top-items td.amt{ text-align:right; font-variant-numeric: tabular-nums; }
  .tag{ display:inline-block; font-size:10.5px; padding:1px 7px; border-radius:10px; color:#fff; }

  /* ---------- Table (Expenses) ---------- */
  .cat-group{ margin-bottom:22px; border:1px solid var(--rule); border-radius:4px; overflow:hidden; background:var(--paper-raised); }
  .cat-group-head{
    display:flex; align-items:center; gap:10px; padding:9px 14px;
    border-bottom:1px solid var(--rule); background:var(--paper);
  }
  .cat-group-head .swatch{ width:9px; height:9px; }
  .cat-group-head .name{ font-weight:600; font-size:12.5px; text-transform:uppercase; letter-spacing:0.05em; }
  .cat-group-head .total{ margin-left:auto; font-variant-numeric: tabular-nums; font-size:13px; color:var(--ink-soft); }
  table.exp{ width:100%; border-collapse:collapse; }
  table.exp th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--ink-soft); font-weight:600; padding:6px 10px; border-bottom:1px solid var(--rule);
  }
  table.exp td{ padding:5px 10px; border-bottom:1px solid var(--rule); vertical-align:middle; }
  table.exp tr:last-child td{ border-bottom:none; }
  table.exp input, table.exp select{
    width:100%; border:1px solid transparent; background:transparent; padding:5px 6px; border-radius:3px;
  }
  table.exp input:hover, table.exp select:hover{ border-color:var(--rule-strong); }
  table.exp input:focus, table.exp select:focus{ outline:none; border-color:var(--brand); background:#fff; }
  table.exp input.amt{ text-align:right; font-variant-numeric: tabular-nums; }
  td.actions{ width:34px; text-align:center; }
  .add-row-bar{ padding:8px 14px; }

  select.cat-picker{ font-size:12px; padding:6px 8px; border:1px solid var(--rule-strong); border-radius:3px; background:#fff; margin-right:8px; }
  .new-cat-input{ font-size:12px; padding:6px 8px; border:1px solid var(--rule-strong); border-radius:3px; width:150px; }

  /* ---------- Income ---------- */
  .earner-row{ display:grid; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) minmax(70px,auto) 34px; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--rule); }
  .earner-row select{ padding:8px 6px; border:1px solid var(--rule-strong); border-radius:3px; background:#fff; min-width:0; width:100%; }
  .earner-row input{ min-width:0; width:100%; }
  .earner-row .num{ text-align:right; font-variant-numeric:tabular-nums; }
  .earner-row.head{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-weight:600; padding-bottom:4px; }
  @media (max-width: 560px){ .earner-row{ grid-template-columns: minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 34px; } .earner-row > .pm{ display:none; } }
  .earner-row input{ padding:8px 10px; border:1px solid var(--rule-strong); border-radius:3px; background:#fff; }
  .freq-toggle{ display:inline-flex; border:1px solid var(--brand); border-radius:3px; overflow:hidden; }
  .freq-toggle button{ background:#fff; border:none; padding:7px 14px; font-size:12.5px; font-weight:600; color:var(--brand); }
  .freq-toggle button.active{ background:var(--brand); color:#fff; }

  .income-summary{ display:grid; grid-template-columns: repeat(3,1fr); gap:16px; margin-top:18px; }
  .mini-card{ background:var(--paper-raised); border:1px solid var(--rule); border-radius:4px; padding:14px 16px; }
  .mini-card .label{ font-size:11px; text-transform:uppercase; color:var(--ink-soft); letter-spacing:0.05em; }
  .mini-card .value{ font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:20px; margin-top:4px; font-variant-numeric: tabular-nums; }

  /* ---------- Savings ---------- */
  .bucket{ border:1px solid var(--rule); border-radius:4px; background:var(--paper-raised); padding:14px 16px; margin-bottom:14px; }
  .bucket-top{ display:grid; grid-template-columns: 1.4fr 1fr 1fr 34px; gap:12px; align-items:end; }
  .field label{ display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin-bottom:4px; }
  .field input{ width:100%; padding:8px 10px; border:1px solid var(--rule-strong); border-radius:3px; background:#fff; }
  .progress-track{ height:7px; background:var(--rule); border-radius:5px; margin-top:12px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--savings); }
  .bucket-foot{ display:flex; justify-content:space-between; margin-top:6px; font-size:11.5px; color:var(--ink-soft); font-variant-numeric: tabular-nums; }

  /* ---------- Forecast ---------- */
  .forecast-controls{ display:flex; gap:24px; flex-wrap:wrap; margin-bottom:22px; padding:14px 16px; background:var(--paper-raised); border:1px solid var(--rule); border-radius:4px; }
  .fc-field{ display:flex; flex-direction:column; gap:5px; min-width:150px; }
  .fc-field label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); }
  .fc-field input[type=range]{ width:100%; }
  .fc-field input[inputmode=decimal]{ width:90px; padding:6px 8px; border:1px solid var(--rule-strong); border-radius:3px; }
  .fc-field .fc-val{ font-variant-numeric: tabular-nums; font-weight:600; font-size:13px; }

  svg text{ font-family:'Inter', sans-serif; }
  .chart-wrap{ background:var(--paper-raised); border:1px solid var(--rule); border-radius:4px; padding:16px; }

  .empty{ color:var(--ink-soft); font-size:13px; padding:20px 0; }

  /* ---------- Settings ---------- */
  .settings-row{
    display:grid; grid-template-columns: 28px 1fr 90px 34px; gap:10px; align-items:center;
    padding:8px 0; border-bottom:1px solid var(--rule);
  }
  .settings-row input[type=text]{ min-width:0; width:100%; padding:8px 10px; border:1px solid var(--rule-strong); border-radius:3px; background:#fff; }
  .settings-row .count{ font-size:11.5px; color:var(--ink-soft); text-align:right; }
  .settings-row .dot{ width:12px; height:12px; border-radius:50%; }
  .settings-row.cat-row{ grid-template-columns: 24px minmax(0,1fr) auto auto 34px; }
  .settings-row.cat-row input[type=color]{ width:22px; height:22px; padding:0; border:none; border-radius:4px; cursor:pointer; background:none; }
  .settings-row .reset-color{ font-size:10px; color:var(--ink-soft); background:none; border:none; cursor:pointer; text-decoration:underline; padding:0; white-space:nowrap; }
  .add-inline{ display:flex; gap:8px; margin-top:12px; }
  .add-inline input{ flex:1; padding:8px 10px; border:1px solid var(--rule-strong); border-radius:3px; background:#fff; }

  /* ---------- Actual vs Budget ---------- */
  .bva-summary{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:26px; }
  .bva-row{ display:grid; grid-template-columns: 140px 1fr 90px 90px 70px 22px; gap:12px; align-items:center; padding:8px 0; border-bottom:1px solid var(--rule); font-size:13px; }
  .bva-row:last-child{ border-bottom:none; }
  .bva-row .cat-name{ font-weight:600; }
  .bva-track{ height:8px; background:var(--rule); border-radius:5px; position:relative; overflow:visible; }
  .bva-track .bva-budget-mark{ position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); }
  .bva-track .bva-fill{ height:100%; border-radius:5px; }
  .bva-row .amt{ text-align:right; font-variant-numeric: tabular-nums; }
  .bva-row .variance.over{ color:var(--warn); font-weight:600; }
  .bva-row .variance.under{ color:var(--good); font-weight:600; }

  /* ---------- Spreadsheet-style actual entries grid ---------- */
  .sheet-wrap{ border:1px solid var(--rule-strong); border-radius:4px; overflow:auto; max-height:520px; background:#fff; }
  table.sheet{ width:100%; border-collapse:collapse; font-size:13px; }
  table.sheet thead th{
    position:sticky; top:0; z-index:2; background:var(--paper); text-align:left;
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-weight:600;
    padding:8px 10px; border-bottom:1px solid var(--rule-strong); border-right:1px solid var(--rule);
  }
  table.sheet td{ padding:0; border-bottom:1px solid var(--rule); border-right:1px solid var(--rule); vertical-align:middle; }
  table.sheet td.rownum{
    text-align:center; color:var(--ink-soft); font-size:11px; background:var(--paper);
    width:34px; user-select:none;
  }
  table.sheet tbody tr:hover td{ background:var(--brand-tint); }
  table.sheet tbody tr:hover td.rownum{ background:var(--brand-tint); }
  table.sheet input, table.sheet select{
    width:100%; height:100%; border:1px solid transparent; background:transparent;
    padding:7px 10px; font-size:13px; font-family:inherit; box-sizing:border-box;
  }
  table.sheet input:focus, table.sheet select:focus{ outline:2px solid var(--brand); outline-offset:-2px; background:#fff; position:relative; z-index:1; }
  table.sheet input.amt{ text-align:right; font-variant-numeric: tabular-nums; }
  table.sheet td.actions-cell{ width:36px; text-align:center; border-right:none; }
  .sheet-addrow{ display:flex; align-items:center; gap:8px; padding:9px 10px; color:var(--ink-soft); font-size:13px; cursor:pointer; background:var(--paper-raised); }
  .sheet-addrow:hover{ background:var(--brand-tint); color:var(--brand-dark); }
  .sheet-addrow .plus{ font-weight:700; }
  .sheet-toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:8px; }
  .paste-zone{ margin-top:14px; }
  .paste-zone textarea{
    width:100%; min-height:90px; border:1px solid var(--rule-strong); border-radius:4px; padding:10px;
    font-family:'Inter',sans-serif; font-size:12.5px; resize:vertical; box-sizing:border-box;
  }
  table.exp.flat select.cat-select{ width:100%; border:1px solid transparent; background:transparent; padding:5px 6px; border-radius:3px; }
  table.exp.flat select.cat-select:hover{ border-color:var(--rule-strong); }
  @media (max-width: 880px){ .bva-summary{ grid-template-columns:1fr; } .bva-row{ grid-template-columns: 100px 1fr 70px 70px 50px 20px; font-size:12px; } }
  @media (max-width: 560px){
    .bva-row{ grid-template-columns: minmax(0,1fr) auto auto auto 22px; gap:4px 8px; }
    .bva-row .cat-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .bva-row .bva-track{ grid-column: 1 / -1; grid-row: 2; }
    .income-summary{ grid-template-columns: repeat(2, minmax(0,1fr)); gap:10px; }
    .mini-card{ min-width:0; }
    .mini-card .value{ font-size:18px; overflow-wrap:anywhere; }
  }

  /* ---------- Home ---------- */
  .home-hello{ font-size:26px; margin-bottom:2px; }
  .home-sub{ color:var(--ink-soft); font-size:13.5px; margin:0 0 18px; }
  .home-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:12px; margin-top:6px; }
  .home-tile{ display:flex; flex-direction:column; align-items:flex-start; gap:6px; text-align:left; cursor:pointer;
    background:var(--paper-raised); border:1px solid var(--rule); border-radius:10px; padding:16px; color:var(--ink);
    font:inherit; transition:border-color .15s, transform .15s; min-width:0; }
  .home-tile:hover, .home-tile:focus-visible{ border-color:var(--brand); outline:none; }
  .home-tile:active{ transform:scale(0.98); }
  .home-ico{ width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    background:var(--brand-tint); color:var(--brand-dark); margin-bottom:4px; }
  .home-tile .t{ font-weight:700; font-size:15px; }
  .home-tile .fig{ font-variant-numeric:tabular-nums; font-size:13.5px; font-weight:600; color:var(--brand-dark); overflow-wrap:anywhere; }
  .home-tile .d{ font-size:12px; color:var(--ink-soft); line-height:1.4; }
  @media (max-width: 560px){
    .home-grid{ grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
    .home-tile{ padding:13px; }
    .home-tile .d{ display:none; }
    .home-hello{ font-size:22px; }
  }

  /* ---------- Scenarios ---------- */
  .scenario-tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px; }
  .scenario-chip{ padding:7px 14px; border-radius:16px; border:1px solid var(--rule-strong); background:#fff; font-size:12.5px; font-weight:600; color:var(--ink); }
  .scenario-chip:hover{ border-color:var(--brand); }
  .scenario-chip.active{ background:var(--brand); color:#fff; border-color:var(--brand); }
  .scenario-chip.add{ background:var(--paper-raised); color:var(--brand); border-style:dashed; }
  .scenario-header{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .scenario-header input[type=text]{
    font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:20px; font-weight:600; color:var(--ink);
    border:none; background:transparent; padding:4px 2px; border-bottom:2px solid transparent; min-width:160px;
  }
  .scenario-header input[type=text]:focus{ outline:none; border-bottom-color:var(--brand); }
  .scenario-actions{ display:flex; gap:8px; align-items:center; }

  /* ---------- Flow ---------- */
  .view.view-wide{ max-width:1440px; }
  .flow-controls{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:12px; }
  .flow-layout{ display:grid; grid-template-columns: minmax(0,1fr) 260px; gap:20px; align-items:start; }
  .flow-chart-wrap{ background:var(--paper-raised); border:1px solid var(--rule); border-radius:4px; padding:16px; overflow-x:auto; position:relative; }
  .flow-node{ cursor:pointer; }
  .flow-node rect.flow-bar{ transition:opacity 0.15s; }
  .flow-node:hover rect.flow-bar{ opacity:0.8; }
  .flow-dim{ opacity:0.25; }
  .flow-tooltip{
    position:absolute; pointer-events:none; background:var(--ink); color:#fff; padding:9px 12px;
    border-radius:4px; font-size:12px; line-height:1.5; box-shadow:0 6px 18px rgba(0,0,0,0.25);
    opacity:0; transform:translateY(2px); transition:opacity 0.1s, transform 0.1s; z-index:5; max-width:250px;
  }
  .flow-tooltip.show{ opacity:1; transform:translateY(0); }
  .flow-tooltip .tt-name{ font-weight:700; margin-bottom:2px; }
  .flow-tooltip .tt-sub{ color:#D7DCD4; font-size:11px; }
  .flow-aside{ display:flex; flex-direction:column; gap:16px; position:sticky; top:16px; }
  .flow-legend{
    background:var(--paper-raised); border:1px solid var(--rule); border-radius:4px; padding:14px 16px;
  }
  .flow-legend h4{ font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:13.5px; margin:0 0 8px; }
  .flow-legend ul{ list-style:none; margin:0; padding:0; }
  .flow-legend li{ display:flex; align-items:center; gap:8px; padding:4px 0; font-size:12px; }
  .flow-legend .swatch{ width:9px; height:9px; border-radius:2px; flex:none; }
  .flow-panel{
    background:var(--paper-raised); border:1px solid var(--rule); border-radius:4px; padding:16px;
  }
  .flow-panel h4{ font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:16px; margin:0 0 2px; }
  .flow-panel .amt-big{ font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:22px; font-weight:600; margin:8px 0 2px; font-variant-numeric: tabular-nums; }
  .flow-panel .pct-line{ font-size:12px; color:var(--ink-soft); margin-bottom:14px; }
  .flow-panel .sub-list{ list-style:none; margin:0; padding:0; border-top:1px solid var(--rule); }
  .flow-panel .sub-list li{ display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px solid var(--rule); font-size:12.5px; }
  .flow-panel .sub-list .n{ color:var(--ink); }
  .flow-panel .sub-list .v{ color:var(--ink-soft); font-variant-numeric: tabular-nums; }
  .flow-hint{ font-size:11.5px; color:var(--ink-soft); margin-top:10px; }
  .flow-callout{
    border-radius:4px; padding:10px 14px; font-size:13px; font-weight:600; margin-bottom:16px; border:1px solid;
  }
  .flow-callout.warn{ background:var(--warn-tint); color:var(--warn); border-color:var(--warn); }
  .flow-callout.good{ background:var(--brand-tint); color:var(--brand-dark); border-color:var(--brand); }
  .flow-callout.neutral{ background:var(--paper-raised); color:var(--ink-soft); border-color:var(--rule); }
  @media (max-width: 880px){ .flow-layout{ grid-template-columns: 1fr; } .flow-aside{ position:static; } }

  /* ---------- Import / Export ---------- */
  .io-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:14px; }
  .io-card{ background:var(--paper-raised); border:1px solid var(--rule); border-radius:4px; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .io-card h4{ font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:14.5px; margin:0; }
  .io-card p{ font-size:12px; color:var(--ink-soft); margin:0; flex:1; }
  .io-card input[type=file]{ font-size:11.5px; }
  .io-status{ font-size:12px; margin-top:10px; padding:8px 10px; border-radius:3px; display:none; }
  .io-status.show{ display:block; }
  .io-status.ok{ background:var(--brand-tint); color:var(--brand-dark); }
  .io-status.err{ background:var(--warn-tint); color:var(--warn); }
  .export-panel{ background:var(--paper-raised); border:1px solid var(--rule); border-radius:4px; padding:16px; }
  .export-checks{ display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:8px; }
  .export-check{ display:flex; align-items:center; gap:8px; font-size:13px; padding:4px 0; cursor:pointer; }
  .export-check input{ width:15px; height:15px; cursor:pointer; }
  @media (max-width: 880px){ .io-grid{ grid-template-columns: 1fr; } }

  @media (max-width: 880px){
    .app{ flex-direction:column; }
    .rail{ width:100%; height:auto; position:sticky; top:0; z-index:40; flex-direction:row; align-items:center; gap:6px; overflow:hidden; padding:12px;
      box-shadow:0 1px 0 rgba(0,0,0,0.06), 0 4px 12px rgba(58,42,44,0.12);
      padding-top:calc(12px + env(safe-area-inset-top, 0px));
      padding-left:calc(12px + env(safe-area-inset-left, 0px)); padding-right:calc(12px + env(safe-area-inset-right, 0px)); }
    .main{ padding-bottom:env(safe-area-inset-bottom, 0px); }
    .rail-brand{ display:none; }
    .rail-nav{ flex-direction:row; flex:1; min-width:0; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
    .rail-nav::-webkit-scrollbar{ display:none; }
    .rail-signout{ display:flex; }
    .tab{ border-left:none; border-bottom:3px solid transparent; white-space:nowrap; }
    .tab.active{ border-left:none; border-bottom:3px solid var(--cat-subscriptions); }
    .rail-foot{ display:none; }
    .stat-strip{ grid-template-columns: repeat(2,1fr); }
    .overview-grid{ grid-template-columns: 1fr; }
    .view{ padding:20px 16px; }
    .bucket-top{ grid-template-columns: 1fr 1fr; }
  }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }

  .danger-zone{ border:1px solid var(--warn); border-radius:4px; padding:16px; background:var(--warn-tint); }
  .danger-zone h4{ margin:0 0 6px; color:var(--warn); font-size:14px; }
  .danger-zone p{ font-size:12.5px; color:var(--ink); margin:0 0 12px; }
  .btn.danger{ background:var(--warn); }
  .btn.danger:hover{ filter:brightness(0.9); }

  /* ---------- Scenario comparison ---------- */
  .scen-compare-wrap{ overflow-x:auto; margin-bottom:26px; }
  table.scen-compare{ width:100%; border-collapse:collapse; background:var(--paper-raised); border:1px solid var(--rule); border-radius:4px; font-size:14px; }
  table.scen-compare th{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-weight:600; padding:10px 14px; text-align:left; border-bottom:1px solid var(--rule); }
  table.scen-compare td{ padding:10px 14px; border-bottom:1px solid var(--rule); }
  table.scen-compare .num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  table.scen-compare tr.total td{ font-weight:700; border-bottom:none; background:var(--paper); }

  /* ---------- Savings split ---------- */
  .split-row{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; margin-top:12px; padding-top:10px; border-top:1px dashed var(--rule); font-size:12.5px; }
  .split-row .split-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-weight:600; }
  .split-person{ display:flex; align-items:center; gap:6px; }
  .split-person .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .split-person input{ width:56px; padding:5px 6px; border:1px solid var(--rule-strong); border-radius:3px; background:#fff; text-align:right; font-size:12.5px; }
  .split-person .amt{ color:var(--ink-soft); font-variant-numeric:tabular-nums; }
  .split-warn{ color:var(--warn); font-weight:600; }
  .split-even{ background:none; border:none; padding:0; color:var(--brand-dark); text-decoration:underline; cursor:pointer; font-size:12px; }

  .idle-warning{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom, 0px)); z-index:50;
    display:flex; gap:14px; align-items:center; background:var(--ink); color:#fff; padding:12px 16px; border-radius:6px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25); font-size:13px; max-width:calc(100vw - 32px); }

  /* ---------- Bank accounts / transfers ---------- */
  .acct-panel{ background:var(--paper-raised); border:1px solid var(--rule); border-radius:4px; padding:14px 16px; margin-bottom:24px; }
  .acct-row{ display:grid; grid-template-columns: minmax(0,1.3fr) minmax(0,1.3fr) auto auto 34px; gap:10px; align-items:center; padding:7px 0; border-bottom:1px solid var(--rule); font-size:13px; }
  .acct-row:last-of-type{ border-bottom:none; }
  .acct-row.head{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-weight:600; padding-top:0; }
  .acct-row input{ min-width:0; width:100%; padding:6px 8px; border:1px solid var(--rule-strong); border-radius:3px; background:#fff; font-size:13px; }
  .acct-row .num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .acct-row .prog{ font-size:12px; color:var(--ink-soft); white-space:nowrap; text-align:right; }
  .acct-row .prog.complete{ color:var(--good); font-weight:600; }
  .acct-row.head .prog{ font-size:inherit; color:inherit; }
  .acct-actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; }
  .acct-actions input{ padding:7px 9px; border:1px solid var(--rule-strong); border-radius:3px; background:#fff; min-width:0; }
  .xfer-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:12px; }
  .xfer-card{ border:1px solid var(--rule); border-radius:4px; background:#fff; padding:10px 12px; }
  .xfer-head{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .xfer-head .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .xfer-head select{ margin-left:auto; padding:4px 6px; border:1px solid var(--rule-strong); border-radius:3px; background:#fff; font-size:12.5px; }
  .xfer-line{ display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--rule); font-size:13px; cursor:pointer; }
  .xfer-line input{ width:16px; height:16px; accent-color:var(--brand); flex:none; }
  .xfer-line .xfer-acc{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .xfer-line .num{ font-variant-numeric:tabular-nums; }
  .xfer-line.done .xfer-acc, .xfer-line.done .num{ opacity:0.5; text-decoration:line-through; }
  .xfer-total{ display:flex; justify-content:space-between; padding-top:7px; font-size:13px; font-weight:700; }
  .xfer-total .num{ font-variant-numeric:tabular-nums; }
  .exp-scroll{ overflow-x:auto; }
  .exp-scroll table.exp{ min-width:760px; }
  table.exp tr.done td:not(.done-cell){ opacity:0.5; }
  table.exp td.done-cell{ text-align:center; }
  table.exp td.done-cell input{ width:18px; height:18px; cursor:pointer; accent-color:var(--brand); }
  @media (max-width: 880px){
    .acct-row{ grid-template-columns: minmax(0,1fr) auto auto 34px; }
    .acct-row .details-col, .acct-row.head .details-col{ display:none; }
  }

  /* ---------- Auth / onboarding ---------- */
  .gate{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--brand-dark); padding:24px;
    padding-top:calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .gate-card{
    background:var(--paper); border-radius:8px; padding:36px 34px; width:100%; max-width:380px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .gate-card .mark{ font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:26px; font-weight:700; color:var(--ink); }
  .gate-card .sub{ font-size:13px; color:var(--ink-soft); margin-top:4px; margin-bottom:26px; }
  .oauth-btn{
    width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    padding:12px 16px; border-radius:5px; border:1px solid var(--rule-strong);
    background:#fff; font-size:14px; font-weight:600; margin-bottom:12px;
  }
  .oauth-btn:hover{ background:var(--paper); }
  .oauth-btn.apple{ background:#000; color:#fff; border-color:#000; }
  .oauth-btn.apple:hover{ background:#1a1a1a; }
  .gate-note{ font-size:11.5px; color:var(--ink-soft); text-align:center; margin-top:18px; line-height:1.5; }
  .gate-divider{ text-align:center; font-size:11px; color:var(--ink-soft); margin:18px 0; position:relative; }
  .gate-error{ background:var(--warn-tint); color:var(--warn); font-size:12.5px; padding:10px 12px; border-radius:4px; margin-bottom:16px; }
  .gate-google-note{ margin-top:16px; padding:12px 14px; border:1px solid var(--rule-strong); border-radius:5px; background:#fff; }
  .gate-google-note p{ font-size:12.5px; color:var(--ink); margin:0 0 10px; line-height:1.5; }
  .gate-google-note p.fine{ font-size:11.5px; color:var(--ink-soft); margin:8px 0 0; }
  .gate-spinner{ text-align:center; color:var(--ink-soft); font-size:13px; padding:30px 0; }

  .onboard-choice{
    display:block; width:100%; text-align:left; padding:14px 16px; border:1px solid var(--rule-strong);
    border-radius:5px; background:#fff; margin-bottom:12px;
  }
  .onboard-choice:hover{ border-color:var(--brand); background:var(--brand-tint); }
  .onboard-choice .t{ font-weight:600; font-size:14px; }
  .onboard-choice .d{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .join-form{ display:none; margin-top:10px; }
  .join-form.show{ display:block; }
  .join-form input{ width:100%; padding:10px 12px; border:1px solid var(--rule-strong); border-radius:4px; margin-bottom:10px; text-transform:uppercase; letter-spacing:0.08em; text-align:center; font-size:16px; }

  .invite-box{
    display:flex; align-items:center; gap:10px; background:var(--brand-tint); border:1px dashed var(--brand);
    border-radius:4px; padding:12px 14px; margin:10px 0 4px;
  }
  .invite-box code{ font-size:18px; font-weight:700; letter-spacing:0.12em; color:var(--brand-dark); flex:1; }
  .who-badge{ font-size:11px; color:#B9C4BC; margin-top:2px; word-break:break-word; }
</style>
</head>
<body>

<div id="gateRoot"></div>

<div class="app" id="appRoot" style="display:none;">
  <nav class="rail">
    <div class="rail-brand">
      <div class="mark">Money Manifest</div>
      <div class="sub">Household budget &amp; forecast</div>
      <div class="who-badge" id="whoBadge"></div>
    </div>
    <div class="rail-nav">
      <button class="tab active" data-view="home"><span class="num">01</span>Home</button>
      <button class="tab" data-view="overview"><span class="num">02</span>Overview</button>
      <button class="tab" data-view="expenses"><span class="num">03</span>Expenses</button>
      <button class="tab" data-view="actual"><span class="num">04</span>Actual</button>
      <button class="tab" data-view="income"><span class="num">05</span>Income</button>
      <button class="tab" data-view="savings"><span class="num">06</span>Savings</button>
      <button class="tab" data-view="forecast"><span class="num">07</span>Forecast</button>
      <button class="tab" data-view="scenarios"><span class="num">08</span>Scenarios</button>
      <button class="tab" data-view="flow"><span class="num">09</span>Flow</button>
      <button class="tab" data-view="settings"><span class="num">10</span>Settings</button>
    </div>
    <button class="rail-signout" id="railSignOutBtn" title="Sign out" aria-label="Sign out"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
    <div class="rail-foot">
      <button id="signOutBtn">Sign out</button>
      <div class="save-note" id="saveNote">Synced</div>
    </div>
  </nav>

  <div class="main">
    <div class="stat-strip">
      <div class="stat">
        <div class="label">Monthly income</div>
        <div class="value" id="statIncome">$0</div>
      </div>
      <div class="stat">
        <div class="label">Monthly expenses</div>
        <div class="value" id="statExpenses">$0</div>
      </div>
      <div class="stat">
        <div class="label">Monthly savings</div>
        <div class="value" id="statSavings">$0</div>
      </div>
      <div class="stat" id="statLeftoverWrap">
        <div class="label">Left over</div>
        <div class="value" id="statLeftover">$0</div>
      </div>
    </div>

    <div id="views"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>

</body>
</html>
